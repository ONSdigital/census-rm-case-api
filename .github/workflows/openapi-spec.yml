name: Case API OpenAPI Document Generation CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  generate-openapi-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 Runtime
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Spotless Formatting and PMD Rules
        run: mvn spotless:check pmd:check

      - name: Build Package and Extract OpenAPI Spec
        run: mvn clean verify -Dcontainer.cli=docker

      - name: Validate OpenAPI Specification
        run: |
          if [ ! -f api-docs/openapi.json ]; then
            echo "ERROR: openapi.json was not generated"
            exit 1
          fi
          # Basic JSON validation
          python3 -m json.tool api-docs/openapi.json > /dev/null || exit 1
          echo "✓ OpenAPI spec is valid JSON"

      - name: Publish Generated OpenAPI Specification Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm-case-api-openapi-specs
          path: api-docs/
          if-no-files-found: warn
          retention-days: 90

      - name: Print Artifact Download Info
        if: always()
        run: |
          echo "Generated artifacts:"
          echo "  - openapi.json (JSON specification - machine readable)"
          echo "  - openapi.md (Markdown documentation)"
          echo "  - openapi.html (Interactive ReDoc HTML)"
          echo ""
          echo "Download from GitHub Artifacts tab for integration teams."
